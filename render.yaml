services:
  - type: web
    name: cop-mcp-server
    env: python
    buildCommand: pip install uv && uv sync
    startCommand: uv run python run_mcp_server.py cop
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PUBLIC_URL
        value: https://cop-mcp-server-m74q.onrender.com
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: thief-mcp-server
    env: python
    buildCommand: pip install uv && uv sync
    startCommand: uv run python run_mcp_server.py thief
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PUBLIC_URL
        value: https://thief-mcp-server-lo1o.onrender.com
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
